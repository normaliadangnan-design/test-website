<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Auth System</title>
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Form container */
        .form-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            min-height: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Form panels */
        .form {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 40px;
            background: white;
            transition: 1s;
        }

        /* Social login buttons */
        .social-login {
            margin: 20px 0;
            display: flex;
            gap: 15px;
        }

        .social-login a {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid #ddd;
            transition: all 0.3s;
        }

        .social-login a:hover {
            background: #f0f0f0;
        }

        /* Form fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Toggle button */
        .toggle-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-btn:hover {
            background: #556ee6;
        }

        /* Category section */
        .category-section {
            padding: 40px;
            background: #f8f9fa;
        }

        .category {
            margin-bottom: 30px;
        }

        .category h2 {
            margin-bottom: 15px;
            color: #333;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .category-card {
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        .category-card:hover {
            transform: translateY(-5px);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .form-container {
                margin: 20px;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container" id="formContainer">
        <!-- Login form -->
        <form class="form login-form" id="loginForm">
            <h2>Sign In</h2>
            <div class="social-login">
                <a href="#"><i class="fab fa-google"></i> Sign in with Google</a>
                <a href="#"><i class="fab fa-facebook-f"></i> Sign in with Facebook</a>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="toggle-btn">Sign In</button>
        </form>

        <!-- Signup form -->
        <form class="form signup-form" id="signupForm">
            <h2>Create Account</h2>
            <div class="social-login">
                <a href="#"><i class="fab fa-google"></i> Sign up with Google</a>
                <a href="#"><i class="fab fa-facebook-f"></i> Sign up with Facebook</a>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="toggle-btn">Create Account</button>
        </form>
    </div>

    <!-- Category section -->
    <section class="category-section">
        <div class="category">
            <h2>$ AT ABOVE ALL</h2>
            <div class="category-grid">
                <div class="category-card">Row 1</div>
                <div class="category-card">Row 2</div>
            </div>
        </div>
        <div class="category">
            <h2>STAFF</h2>
            <div class="category-grid">
                <div class="category-card">Row 1</div>
                <div class="category-card">Row 2</div>
            </div>
        </div>
        <div class="category">
            <h2>SCROLLINGMEMBER</h2>
            <div class="category-grid">
                <div class="category-card">Row 1</div>
                <div class="category-card">Row 2</div>
            </div>
        </div>
    </section>

    <script>
        // JavaScript for form toggle (you'll need Font Awesome for icons)
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const form = btn.closest('.form');
                form.style.left = form === document.querySelector('.login-form') ? '100%' : '0';
            });
        });
    </script>
</body>
</html>
